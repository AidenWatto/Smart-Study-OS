<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
   
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart StudyOS - AI-Powered Academic Productivity</title>
    <meta name="description" content="AI-Powered Academic Productivity & Focus Management System" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply theme before React hydrates to prevent flash
      try {
        var t = JSON.parse(localStorage.getItem('smartstudyos_theme') || '"dark"');
        document.documentElement.classList.toggle('dark', t === 'dark');
      } catch(e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
